# v3.6 PR16 — Prometheus scrape config (Panel 5 concurrent_fetch_max)
# server endpoint: GET /api/v1/metrics (PlainTextResponse, Prometheus exposition format)
#
# 적용:
# - Prometheus Operator: ServiceMonitor 또는 PodMonitor 로 변환
# - 기존 Prometheus: prometheus.yml 의 scrape_configs section 에 병합

scrape_configs:

  - job_name: visionai_v3_6
    metrics_path: /api/v1/metrics
    scrape_interval: 15s     # spec §2.1 concurrent_fetch_max 1min max → 4 sample
    scrape_timeout: 5s
    static_configs:
      # 운영 환경 별 host:port 치환 (예: kubernetes service / DNS)
      - targets:
          - "visionai-api:8000"
        labels:
          environment: production
          service: visionai-price-engine

