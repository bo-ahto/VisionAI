# v3.6 Phase 2 — Grafana Alerting contact points (v10+)
# spec: docs/v3_5_step4_drift_monitoring.md §4.1 severity 분류
# env vars: SLACK_WEBHOOK_ML_ROLLOUT / SLACK_WEBHOOK_ML_ALERTS / PAGERDUTY_INTEGRATION_KEY

apiVersion: 1

contactPoints:

  - orgId: 1
    name: slack-ml-rollout
    receivers:
      - uid: cp-slack-ml-rollout
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_ML_ROLLOUT}
          recipient: "#ml-rollout"
          title: "[VisionAI v3.6 / {{ .Status }}] {{ .CommonLabels.severity }}"
          text: |
            *{{ .CommonAnnotations.summary }}*
            spec: {{ .CommonLabels.spec }}
            action: {{ .CommonLabels.action }}
            runbook: {{ .CommonAnnotations.runbook }}
            firing: {{ len .Alerts.Firing }} / resolved: {{ len .Alerts.Resolved }}

  - orgId: 1
    name: slack-ml-alerts
    receivers:
      - uid: cp-slack-ml-alerts
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_ML_ALERTS}
          recipient: "#ml-alerts"
          title: "[VisionAI v3.6 / {{ .Status }}] {{ .CommonLabels.severity }}"
          text: |
            *{{ .CommonAnnotations.summary }}*
            spec: {{ .CommonLabels.spec }}
            action: {{ .CommonLabels.action }}
            runbook: {{ .CommonAnnotations.runbook }}
            firing: {{ len .Alerts.Firing }} / resolved: {{ len .Alerts.Resolved }}

  - orgId: 1
    name: pagerduty-on-call
    receivers:
      - uid: cp-pagerduty-on-call
        type: pagerduty
        settings:
          integrationKey: ${PAGERDUTY_INTEGRATION_KEY}
          severity: '{{ if eq .CommonLabels.severity "rollback" }}critical{{ else }}error{{ end }}'
          summary: "[VisionAI v3.6] {{ .CommonAnnotations.summary }}"
          source: "grafana-prod"
          class: "{{ .CommonLabels.action }}"
          group: "visionai-v3.6"
          customDetails:
            spec: "{{ .CommonLabels.spec }}"
            runbook: "{{ .CommonAnnotations.runbook }}"
