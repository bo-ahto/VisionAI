[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visionai"
version = "0.1.0"
description = "Computer Vision & AI Platform"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
]
train = [
    "wandb>=0.16",
    "albumentations>=1.3",
    "timm>=0.9",
]
price-engine-core = [
    "pandas>=2.1",
    "pyarrow>=14.0",
    "scikit-learn>=1.3",
    "catboost>=1.2",
]
price-engine-exp = [
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "optuna>=3.4",
    "shap>=0.43",
]
price-engine-api = [
    "fastapi>=0.104",
    "uvicorn>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# sklearn 관례: X_train / X_test capitalization (N803, N806).
# Korean docstring 안의 × (MULTIPLICATION SIGN) 같은 ambiguous unicode 허용 (RUF002).
"src/visionai/price_engine/_eval_helpers.py" = ["N803", "N806", "RUF002"]
# 기존 scripts/ 는 v3.0 작업 중 ruff 도입 → strict 통과 v3.1 로 점진 정리.
"scripts/*.py" = ["E402", "E501", "F541", "F841", "N803", "N806", "RUF001", "RUF002", "RUF003", "B007", "SIM102", "SIM108", "UP032", "UP038"]

[tool.ruff.lint.isort]
known-first-party = ["visionai"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]
