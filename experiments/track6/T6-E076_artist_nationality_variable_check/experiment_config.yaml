target: ln_price_krw
compare_against: 기준 모델과 작가 국적 변수 추가 모델을 Warm/Cold에서 각각 비교한다.
artist_meta_missing_check: required
artist_meta_decision_rule: measure_effect_first_then_decide_missing_imputation_or_collection
artist_meta_dataset_rule: keep_original_split_add_raw_missing_flags_and_completeness_score
