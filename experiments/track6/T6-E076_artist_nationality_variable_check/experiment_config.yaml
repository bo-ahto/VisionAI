experiment_id: T6-E076
status: planned
phase: individual_variable_screening
title: 작가 국적 변수 영향 확인
hypothesis: 작가 국적 변수는 가격 예측에 영향을 미친다.
source_file: data/track6/track6_feature_candidates_name_corrected.csv
